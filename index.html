<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة هوية - سامح بكر الصديق</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES (DESIGN TOKENS)
           ========================================================================== */
        :root {
            /* Brand & Theme Colors */
            --primary-color: #0F695D;    /* Main teal header/accent */
            --accent-color: #EE3A23;     /* Coral red dynamic highlight */
            --bg-page: #0D1117;          /* Page background for presentation */
            --card-bg: #FFFFFF;          /* Pure card face background */
            --text-dark: #1E293B;        /* Primary text color */
            --text-muted: #64748B;       /* Secondary/Label text color */
            --border-light: rgba(226, 232, 240, 0.8);
            
            /* Print & Display Dimensions (ISO 7810 ID-1 Standard) */
            --card-width: 85.6mm;
            --card-height: 54mm;
            --card-radius: 3.5mm;
            
            /* Typography Scale */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-name: 3.2mm;
            --font-title: 2.1mm;
            --font-org: 2.0mm;
            --font-label: 1.8mm;
            --font-value: 2.3mm;
            
            /* Interactive Shadows & Lighting */
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
            --card-edge-highlight: inset 0 1px 1px 0 rgba(255, 255, 255, 0.8), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.05);
        }

        /* ==========================================================================
           2. GLOBAL RESETS & PAGE LAYOUT
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Perspective wrapper for realistic 3D tilt effect */
        .card-perspective-wrapper {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px 0;
        }

        /* ==========================================================================
           3. ID CARD CONTAINER & REALISTIC SURFACE STYLES
           ========================================================================== */
        .id-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-rows: 3mm 1fr;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            user-select: none;
            box-shadow: var(--shadow-card), var(--card-edge-highlight);
        }

        /* Light sheen overlay passing diagonally across surface */
        .card-sheen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                125deg,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                rgba(0, 0, 0, 0.03) 60%,
                rgba(255, 255, 255, 0.15) 100%
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Decorative top brand bar */
        .card-header-bar {
            background: linear-gradient(90deg, var(--primary-color) 70%, var(--accent-color) 100%);
            width: 100%;
            height: 100%;
        }

        /* ==========================================================================
           4. CARD INNER CONTENT GRID & PROFILE SECTION
           ========================================================================== */
        .card-body {
            display: grid;
            grid-template-columns: 32mm 1fr;
            padding: 2.5mm 3.5mm 3mm 3.5mm;
            gap: 3mm;
            height: calc(var(--card-height) - 3mm);
            z-index: 2;
        }

        /* Left Side: Profile Photo & Title Details */
        .card-profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Rounded square photo container */
        .photo-frame {
            width: 18mm;
            height: 18mm;
            border-radius: 2.5mm;
            overflow: hidden;
            background-color: #E2E8F0;
            border: 0.4mm solid var(--primary-color);
            position: relative;
            box-shadow: 0 1mm 2mm rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5mm;
            flex-shrink: 0;
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Fallback SVG initials circle if photo fails or missing */
        .avatar-fallback {
            width: 100%;
            height: 100%;
            background-color: var(--primary-color);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5mm;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .person-name {
            font-size: var(--font-name);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.15;
            margin-bottom: 0.8mm;
            word-break: break-word;
        }

        .person-title {
            font-size: var(--font-title);
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 0.5mm;
        }

        .person-org {
            font-size: var(--font-org);
            color: var(--text-muted);
            line-height: 1.15;
            font-weight: 500;
        }

        /* ==========================================================================
           5. CONTACT INFORMATION & SOCIAL LINKS
           ========================================================================== */
        .card-details-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 0.2mm solid var(--border-light);
            padding-right: 2.5mm;
        }

        .contact-group {
            display: flex;
            flex-direction: column;
            gap: 1.2mm;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
        }

        .contact-label {
            font-size: var(--font-label);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            margin-bottom: 0.1mm;
        }

        .contact-value {
            font-size: var(--font-value);
            color: var(--text-dark);
            font-weight: 700;
            text-decoration: none;
            direction: ltr;
            text-align: right;
            transition: color 0.15s ease;
            display: inline-block;
            border-radius: 2px;
        }

        .contact-value:hover, .contact-value:focus {
            color: var(--primary-color);
        }

        /* Social Icons Row */
        .social-links-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            margin-top: 1mm;
            padding-top: 1mm;
            border-top: 0.2mm dashed var(--border-light);
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5.5mm;
            height: 5.5mm;
            color: var(--primary-color);
            transition: transform 0.15s ease, color 0.15s ease;
            text-decoration: none;
            border-radius: 1mm;
        }

        .social-link svg {
            width: 4mm;
            height: 4mm;
            fill: currentColor;
        }

        .social-link:not(.disabled):hover,
        .social-link:not(.disabled):focus {
            color: var(--accent-color);
            transform: translateY(-1px);
        }

        .social-link.disabled {
            color: #CBD5E1;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Keyboard Accessibility Focus Outline */
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* ==========================================================================
           6. PRINT BUTTON & PAGE CONTROLS
           ========================================================================== */
        .actions-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .print-btn {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(15, 105, 93, 0.4);
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            min-width: 44px;
            min-height: 44px;
        }

        .print-btn:hover {
            background-color: #0B5249;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 105, 93, 0.5);
        }

        .print-btn:active {
            transform: translateY(0);
        }

        .print-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ==========================================================================
           7. PRINT STYLESHEET (TRUE SIZE PRINT ONLY)
           ========================================================================== */
        @media print {
            @page {
                size: 85.6mm 54mm;
                margin: 0;
            }

            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .card-perspective-wrapper {
                perspective: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: var(--card-width) !important;
                height: var(--card-height) !important;
            }

            .id-card {
                transform: none !important;
                box-shadow: none !important;
                border: 0.1mm solid #CBD5E1 !important;
                width: var(--card-width) !important;
                height: var(--card-height) !important;
            }

            .card-sheen, .actions-container {
                display: none !important;
            }
        }

        /* Mobile tap targets & responsiveness adaptation */
        @media (max-width: 480px) {
            .card-perspective-wrapper {
                transform: scale(1.05);
            }
            
            .social-link {
                min-width: 44px;
                min-height: 44px;
            }
        }
    </style>

    <script>
        /* ==========================================================================
           8. JAVASCRIPT: INTERACTIVE TILT & PHOTO FALLBACK LOGIC
           ========================================================================== */
        
        // Image Load Error Handler (Shows Initials Circle if image fails or URL is empty)
        function handleImageError(imgElement) {
            imgElement.style.display = 'none';
            const fallback = document.getElementById('avatarFallback');
            if (fallback) {
                fallback.style.display = 'flex';
            }
        }

        // Initialize script once DOM content is ready
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('idCard');
            const photo = document.getElementById('userPhoto');

            // Trigger fallback immediately if src attribute is empty
            if (!photo.getAttribute('src') || photo.getAttribute('src').trim() === '') {
                handleImageError(photo);
            }

            // Check if user prefers reduced motion
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion || !card) return;

            let bounds;
            let animationFrameId;

            function updateTilt(e) {
                if (!bounds) bounds = card.getBoundingClientRect();
                
                const mouseX = e.clientX - bounds.left;
                const mouseY = e.clientY - bounds.top;
                
                const centerX = bounds.width / 2;
                const centerY = bounds.height / 2;
                
                // Calculate tilt angles (max tilt ~ 8 degrees for clear readability)
                const rotateX = ((mouseY - centerY) / centerY) * -8;
                const rotateY = ((mouseX - centerX) / centerX) * 8;
                
                card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
            }

            card.addEventListener('mouseenter', () => {
                bounds = card.getBoundingClientRect();
                card.style.transition = 'transform 0.1s ease-out';
            });

            card.addEventListener('mousemove', (e) => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(() => updateTilt(e));
            });

            card.addEventListener('mouseleave', () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                card.style.transition = 'transform 0.5s ease-out, box-shadow 0.5s ease-out';
                card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        });
    </script>
